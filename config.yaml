# ─────────────────────────────────────────────────────────────────────────────
# 摸玉日报 (AI & Tech Radar) - 全局核心配置文件
# 所有抓取开关、抓取数量、子分类、展示顺序、筛选门槛全部集中在此解耦配置
# ─────────────────────────────────────────────────────────────────────────────

site:
  name: "摸玉日报"
  tagline: "无聊时随便看点什么"
  timezone: "Asia/Shanghai"
  # 输出目录（默认输出到前端的 public/data 供静态访问）
  outputDir: "packages/web/public/data"

# 定时抓取调度配置（Cron 表达式，默认每天两次：北京时间 08:00 与 16:00）
schedule:
  enabled: true
  cron: "0 8,16 * * *"

# 大模型 (LLM) 翻译与解读配置
# 支持多提供商轮询、随机抽取并发（3 个 worker 并发，每批 10 条，支持动态故障转移）
llm:
  enabled: true
  batchSize: 10 # 每次把 10 条内容送给一个 LLM
  concurrentWorkers: 3 # 每次随机挑选 3 个 LLM 并发翻译（单次可处理 30 条）
  timeoutMs: 60000 # 统一超时 60 秒
  providers:
    # 1. Groq1
    - name: "Groq1"
      baseUrl: "https://api.groq.com/openai/v1/chat/completions"
      model: "openai/gpt-oss-120b"
      apiKeyEnv: "Groq1_apikey"
      timeoutMs: 60000

    # 2. Groq2
    - name: "Groq2"
      baseUrl: "https://api.groq.com/openai/v1/chat/completions"
      model: "openai/gpt-oss-120b"
      apiKeyEnv: "Groq2_apikey"
      timeoutMs: 60000

    # 3. OLLAMA1
    - name: "OLLAMA1"
      baseUrl: "https://ollama.com/v1/chat/completions"
      model: "gpt-oss:120b"
      apiKeyEnv: "OLLAMA1_apikey"
      timeoutMs: 60000

    # 4. OLLAMA2
    - name: "OLLAMA2"
      baseUrl: "https://ollama.com/v1/chat/completions"
      model: "gpt-oss:120b"
      apiKeyEnv: "OLLAMA2_apikey"
      timeoutMs: 60000

    # 5. HuggingFace
    - name: "HFACE"
      baseUrl: "https://router.huggingface.co/v1/chat/completions"
      model: "deepseek-ai/DeepSeek-V4.1-Flash"
      apiKeyEnv: "HFACE_apikey"
      timeoutMs: 60000

    # 6. Vercel
    - name: "vercel"
      baseUrl: "https://ai-gateway.vercel.sh/v1/chat/completions"
      model: "alibaba/qwen3.7-flash"
      apiKeyEnv: "vercel_apikey"
      timeoutMs: 60000

    # 7. AMD1
    - name: "amd1"
      baseUrl: "https://developer.amd.com.cn/radeon/api/v1/chat/completions"
      model: "DeepSeek-V4-Flash"
      apiKeyEnv: "amd1_apikey"
      timeoutMs: 60000

    # 8. AMD2
    - name: "amd2"
      baseUrl: "https://developer.amd.com.cn/radeon/api/v1/chat/completions"
      model: "Qwen3.8-Flash-Next"
      apiKeyEnv: "amd2_apikey"
      timeoutMs: 60000

# ─────────────────────────────────────────────────────────────────────────────
# 板块定义与顺序（自上而下严格决定抓取顺序与前端呈现顺序）
# ─────────────────────────────────────────────────────────────────────────────
boards:
  # 栏目一：GitHub 开源趋势
  - id: repos
    name: "GitHub 开源趋势"
    source: github
    enabled: true
    limit: 25 # 官方标准榜全量 Top 25
    translate: true
    options:
      baseUrl: "https://x.cqforest.com/gh"
      languages: [""] # 官方标准总榜（包括所有语言）
      since: "daily" # 限定在今天

  # 栏目二：Hacker News 科技热点
  - id: news
    name: "Hacker News"
    source: hackernews
    enabled: true
    translate: true # 开启 LLM 汉化翻译与精炼
    options:
      channels:
        - id: top
          name: "TOP 热门"
          endpoint: "https://hacker-news.firebaseio.com/v0/topstories.json"
          limit: 15
        - id: show
          name: "SHOW 自荐"
          endpoint: "https://hacker-news.firebaseio.com/v0/showstories.json"
          limit: 15
        - id: best
          name: "BEST 精选"
          endpoint: "https://hacker-news.firebaseio.com/v0/beststories.json"
          limit: 15

  # 栏目三：Dev.to 技术实战
  - id: devto
    name: "Dev.to 开发者社区"
    source: devto
    enabled: true
    translate: true
    options:
      channels:
        - id: latest
          name: "最新精选"
          url: "https://dev.to/api/articles?per_page=30"
          limit: 15
        - id: opensource
          name: "开源精选"
          url: "https://dev.to/api/articles?tag=opensource&per_page=30"
          limit: 15

  # 栏目四：Lobste.rs 极客社区
  - id: lobsters
    name: "Lobste.rs 极客社区"
    source: lobsters
    enabled: true
    translate: true
    options:
      channels:
        - id: release
          name: "Release 版本"
          url: "https://lobste.rs/t/release.json"
          limit: 15
        - id: ai
          name: "AI 议题"
          url: "https://lobste.rs/t/ai.json"
          limit: 15
        - id: show
          name: "Show 作品"
          url: "https://lobste.rs/t/show.json"
          limit: 15

  # 栏目五：Product Hunt 今日新品（替换原 HF 板块）
  - id: producthunt
    name: "Product Hunt 今日新品"
    source: producthunt
    enabled: true
    limit: 15
    translate: true
    options:
      tokenEnv: "PRODUCT_HUNT_TOKEN"
      feedUrl: "https://www.producthunt.com/feed"
      apiEndpoint: "https://api.producthunt.com/v2/api/graphql"
