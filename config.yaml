# ─────────────────────────────────────────────────────────────────────────────
# 板块热度评分机制（透明评分公式）
# 归一化得分：norm = min(1, curve(原始数值) / curve(上限 cap))
# 最终维度积分：points = norm × 权重 weight / 权重总和 Σweight × 100
# ─────────────────────────────────────────────────────────────────────────────
boards:
  # 开源项目板块
  repos:
    size: 10                  # 每日主榜展示项目数量
    runnersUp: 10             # 候补项目数量（界面可折叠展开）
    signals:
      - { key: stars_today, weight: 40, cap: 1500, curve: log }      # 今日 Star 增量（权重 40，上限 1500，对数衰减）
      - { key: momentum,    weight: 15, cap: 30,   curve: sqrt }     # 增长动能：今日增量占总 Star 比例（权重 15，上限 30%，平方根曲线）
      - { key: hn_echo,     weight: 15, cap: 500,  curve: log }      # HN 回响：讨论该项目的 Hacker News 故事热度（权重 15，上限 500）
      - { key: echo,        weight: 10, cap: 2,    curve: linear }   # 跨板块联动（权重 10，上限 2）
      - { key: novelty,     weight: 10, cap: 1,    curve: linear }   # 新颖度：首次上榜为 1，在榜期间逐渐衰减（权重 10，线性曲线）
      - { key: relevance,   weight: 10, cap: 1,    curve: linear }   # 相关度：与 AI 核心主题的契合程度（权重 10，线性曲线）

  # Hugging Face 热门模型板块
  hf:
    size: 10                  # 每日主榜展示模型数量
    runnersUp: 10             # 候补模型数量
    signals:
      - { key: trending_score, weight: 45, cap: 1500, curve: log }      # HF 模型趋势分（权重 45，上限 1500，对数衰减）
      - { key: hf_likes,       weight: 30, cap: 5000, curve: log }      # HF 页面点赞数（权重 30，上限 5000，对数衰减）
      - { key: novelty,        weight: 15, cap: 1,    curve: linear }   # 新颖度加成（权重 15，线性衰减）
      - { key: relevance,      weight: 10, cap: 1,    curve: linear }   # AI 主题相关度（权重 10）

  # 科技要闻板块
  news:
    size: 10                  # 每日主榜展示新闻数量
    runnersUp: 10             # 候补新闻数量
    signals:
      - { key: points,    weight: 40, cap: 800, curve: log }         # HN 获赞得分（权重 40，上限 800）
      - { key: comments,  weight: 15, cap: 400, curve: log }         # 评论讨论数（权重 15，上限 400）
      - { key: velocity,  weight: 20, cap: 60,  curve: sqrt }        # 传播速度：发帖以来的每小时点赞增速（权重 20，上限 60）
      - { key: echo,      weight: 15, cap: 2,   curve: linear }      # 跨板块联动：指向/关联其他板块项目的数量（权重 15，上限 2）
      - { key: relevance, weight: 10, cap: 1,   curve: linear }      # AI 主题相关度（权重 10）

  # 社区热议板块
  social:
    size: 10                  # 每日主榜展示帖子数量
    runnersUp: 10             # 候补帖子数量
    signals:
      - { key: lift,       weight: 30, cap: 5,    curve: sqrt }      # 爆发率：相比该作者或该社区平常热度的爆发倍数（权重 30，上限 5倍）
      - { key: reach,      weight: 20, cap: 5000, curve: log }       # 曝光范围：X(点赞+2·转推+3·引用+回复) · Reddit(得分)（权重 20）
      - { key: discussion, weight: 10, cap: 500,  curve: log }       # 互动热度：回复与评论总数（权重 10，上限 500）
      - { key: velocity,   weight: 10, cap: 500,  curve: sqrt }      # 扩散速率：发布以来的时均互动量，要求发帖时长≥0.5小时（权重 10）
      - { key: authority,  weight: 15, cap: 1.5,  curve: linear }    # 账号权威：官方机构号 > 行业知名人物 > 社区子版块（权重 15）
      - { key: echo,       weight: 10, cap: 2,    curve: linear }    # 跨板块联动：与其他板块的互相引用数（权重 10）
      - { key: relevance,  weight: 5,  cap: 1,    curve: linear }    # AI 主题契合度（权重 5）
    caps: { perAuthor: 2, perCommunity: 3, perPlatform: 7 }          # 单个作者最多2条，单个社区最多3条，单个平台最多7条


# LLM 翻译与信息处理配置
# 支持配置多个 LLM 提供商，按列表顺序依次调用：
# - 优先调用 1 号提供商
# - 若遇到 429 限流，自动对该提供商启动 60 秒冷却，期间自动切换到 2 号，冷却结束后恢复优先调用
# - 若遇到超时或错误，自动平滑顺延至 2 号、3 号...
enrich:
  enabled: true
  languages: [zh]                              # 专注于高质量中文
  batchSize: 10                                # 每次提交 10 条（小批次避免超时）
  concurrency: 5                               # 并发工作线程数（同时分配给不同可用渠道并发执行）
  maxItemsPerRun: 120
  briefs: true                                 # 自动生成每日重点与摘要列表

  # 多个提供商按优先级从上到下排列
  providers:
    # 1号提供商：Groq1
    - name: Groq1
      baseUrl: https://api.groq.com/openai/v1/chat/completions
      model: openai/gpt-oss-120b
      apiKeyEnv: Groq1_apikey
      timeoutMs: 60000

    # 2号提供商：Groq2
    - name: Groq2
      baseUrl: https://api.groq.com/openai/v1/chat/completions
      model: openai/gpt-oss-120b
      apiKeyEnv: Groq2_apikey
      timeoutMs: 60000

    # 3号提供商：Groq3
    - name: Groq3
      baseUrl: https://api.groq.com/openai/v1/chat/completions
      model: openai/gpt-oss-120b
      apiKeyEnv: Groq3_apikey
      timeoutMs: 60000

    # 4号提供商：OLLAMA1
    - name: OLLAMA1
      baseUrl: https://ollama.com/v1/chat/completions
      model: gpt-oss:120b
      apiKeyEnv: OLLAMA1_apikey
      timeoutMs: 60000

    # 5号提供商：OLLAMA2
    - name: OLLAMA2
      baseUrl: https://ollama.com/v1/chat/completions
      model: gpt-oss:120b
      apiKeyEnv: OLLAMA2_apikey
      timeoutMs: 60000

    # 7号提供商：HuggingFace
    - name: HFACE
      baseUrl: https://router.huggingface.co/v1/responses
      model: deepseek-ai/DeepSeek-V4.1-Flash
      apiKeyEnv: HFACE_apikey
      timeoutMs: 60000

    # 8号提供商：GitHub Models
    # 9号提供商：Vercel
    - name: vercel
      baseUrl: https://ai-gateway.vercel.sh/v1/responses
      model: alibaba/qwen3.7-flash
      apiKeyEnv: vercel_apikey
      timeoutMs: 60000

    # 10号提供商：AMD1
    - name: amd1
      baseUrl: https://developer.amd.com.cn/radeon/api/v1/chat/completions
      model: DeepSeek-V4-Flash
      apiKeyEnv: amd1_apikey
      timeoutMs: 60000

    # 11号提供商：AMD2
    - name: amd2
      baseUrl: https://developer.amd.com.cn/radeon/api/v1/chat/completions
      model: Qwen3.8-Flash-Next
      apiKeyEnv: amd2_apikey
      timeoutMs: 60000
# 模型价格指数配置（抓取各大主流模型的 Token 定价与比价数据）
pricing:
  enabled: false

# 定时邮件推送配置。此处为默认设置：在前端网页的“设置 › 邮件投递”中配置的值会直接写入仓库变量 RESONANCE_MAIL，
# 认证凭据写入仓库 Secrets（MAIL_TO, SMTP_USER, SMTP_PASS 或 RESEND_API_KEY）。
mail:
  enabled: false
  frequency: daily            # 发送频率：daily（每日）| weekly（每周）| both（每日和每周）
  weekday: 2                  # 周报发送日：2 = 周二（此时美西时间上一周刊期已完全沉淀封存，1~7 对应周一至周日）
  time: '09:30'               # 定时发送时间（格式：'HH:mm'）
  timezone: Asia/Shanghai     # 发送时区
  lang: zh                    # 邮件正文语言：zh（中文）| en（英文）
  provider: smtp              # 发送通道：smtp（SMTP邮件服务）| resend（Resend 平台）
  preset: qq                  # SMTP 邮箱预设：qq（QQ邮箱）| 163（网易163）| gmail | custom（自定义主机/端口/加密）
  attach: true                # 是否在邮件中作为附件附带交互式 HTML 完整报告文件
  perBoard: 5                 # 邮件正文中每个板块展示的 Top 条目数量
