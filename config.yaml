# ─────────────────────────────────────────────────────────────────────────────
#  AI Resonance（AI共振）— 项目的核心配置文件。
#  只需修改主题（关键词 / 话题 / 分类），即可为 Rust、生物信息学、机器人等任何领域
#  构建每日技术雷达。下方的评分公式会原样展示在网站的“评分机制说明”页面。
# ─────────────────────────────────────────────────────────────────────────────

site:
  name: 摸玉日报
  tagline:
    en: When bored, just watch something random.
    zh: 无聊时随便看点什么。
  # 部署配置：repoUrl 填写您的 GitHub 仓库地址；siteUrl 留空时 CI 会自动推导为 https://<用户名>.github.io/<仓库名>/
  repoUrl: https://github.com/siknet/OpenMoreJade    # 页脚链接、设置中的邮件投递、请求头 User-Agent 联系地址
  siteUrl: https://www.liriver.net     # 订阅源、邮件内链接、llms.txt 使用；优先级高于环境变量 SITE_URL
  defaultLang: zh             # 默认语言：en（英文）| zh（中文）— 当浏览器未提供偏好时的首选语言
  theme:
    preset: paper          # 界面主题预设：titanium（钛金）| paper（纸张）| terminal（终端黑）— 详见 docs/CUSTOMIZE.md
    accent: ''                # 主题强调色：支持任意 CSS 颜色（如 '#10a37f'）；留空则使用预设默认色

# 每日刊期的定义。刊期 D = 该时区下的 [D 截止时间, D+1 截止时间)。
# 带有明确时间戳的条目（HN、X、官方机构博文）按其自身发布时间归档；
# GitHub Star 增量以两个截止时间之间的变化为准。截止时间经过 settleHours 小时后，
# 系统会重新读取互动数据完成数据沉淀（settle），确保晚发布的条目得到公正评估。
edition:
  timezone: Asia/Shanghai   # 刊期时区：如 Asia/Shanghai（中国标准时间）或 America/Los_Angeles（美西时间）
  cutoff: '00:00'           # 每日截止交割时间（格式：'HH:mm'）
  settleHours: 8            # 截止后多少小时内重新拉取互动数据，完成沉淀封存

retention:
  days: 183                   # 趋势历史记忆天数：保留半年（183天）的历史快照
  candidatesPerBoard: 60      # 每天各板块保留的原始候选条目上限（控制仓库体积）

# 相关性判定标准：用于开源项目（repos）和科技要闻（news）的分类器。
# 论文（papers）板块默认直接通过（根据数据源配置的学科类别自动拉取）。
topic:
  minRelevance: 0.35          # 最低相关性得分阈值（低于此分数的条目将被过滤淘汰）
  strongKeywords:             # 强关键词：标题或描述中只要命中任意一个，即明确判定为“高度相关”
    - llm
    - large language model
    - language model
    - generative ai
    - genai
    - machine learning
    - deep learning
    - neural network
    - transformer
    - diffusion model
    - reinforcement learning
    - fine-tuning
    - finetuning
    - rag
    - retrieval-augmented
    - ai agent
    - agentic
    - multi-agent
    - mcp
    - model context protocol
    - prompt engineering
    - text-to-image
    - text-to-video
    - text-to-speech
    - speech recognition
    - computer vision
    - embedding
    - vector database
    - inference engine
    - gpt
    - chatgpt
    - openai
    - anthropic
    - opensource
    - open source
    - claude
    - gemini
    - deepseek
    - qwen
    - llama                   # 也匹配 llama.cpp
    - mistral
    - kimi
    - glm
    - grok
    - codex
    - gemma
    - ollama
    - vllm
    - hugging face
    - huggingface
    - stable diffusion
    - copilot
    - agi
    - 大模型
    - 智能体
  weakKeywords:               # 弱关键词：需要命中两个以上，或者命中一个弱关键词外加匹配一个分类/域名
    - ai
    - agent
    - agents
    - model
    - models
    - inference
    - training
    - gpu
    - cuda
    - nvidia
    - benchmark
    - reasoning
    - chatbot
    - assistant
    - alignment
    - tokens
    - robotics
    - autonomous
  githubTopics:               # GitHub 话题标签匹配列表
    - ai
    - artificial-intelligence
    - machine-learning
    - deep-learning
    - llm
    - llms
    - large-language-models
    - generative-ai
    - agents
    - ai-agents
    - rag
    - mcp
    - nlp
    - computer-vision
    - diffusion
    - transformers
    - pytorch
    - reinforcement-learning
    - multimodal
    - text-to-speech
    - speech-recognition
    - vector-database
    - inference
    - fine-tuning
  domains:                    # 权威域名白名单：来自这些站点的文章直接判定为相关
    - openai.com
    - anthropic.com
    - deepmind.google
    - ai.google
    - huggingface.co
    - x.ai
    - stability.ai
  exclude:                    # 排除名单（一票否决）：命中此名单的条目将被直接过滤丢弃
    - awesome-list-of-jobs

sources:
  # GitHub 官方 Trending 趋势榜
  githubTrending:
    enabled: true
    since: daily              # 默认趋势跨度：daily（日）| weekly（周）| monthly（月）
    languages: ['', python, typescript, rust, go,]   # 抓取的语言分类，'' 表示不限语言

  # GitHub 全局项目搜索（补充 Trending 遗漏的新鲜优质项目）
  githubSearch:
    enabled: true
    # 检索条件组：GitHub API 不支持在限定词间使用 OR（会报 422 错误）。{{d-N}} 表示今天减去 N 天。
    queries:
      - 'created:>{{d-7}} stars:>100'                     # 近7天创建且热度>100星的新项目（新项目往往还没贴标签）
      - 'created:>{{d-30}} pushed:>{{d-2}} stars:>300'    # 近1月创建且近期活跃、热度>300星的项目
      - 'llm OR agent OR ai in:name,description,topics created:>{{d-30}} stars:>200'
      - 'topic:llm pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:ai-agents pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:mcp pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:rag pushed:>{{d-7}} created:>{{d-365}}'
      - 'topic:generative-ai pushed:>{{d-7}} created:>{{d-365}}'
    perQuery: 50              # 每个搜索表达式拉取的最大结果数

  # Hugging Face 模型流行趋势（Trending Models）
  hfTrending:
    enabled: true
    limit: 10                 # 抓取热门模型数量（默认 10）
    prior: 1.0                # 先验加权系数

  # Hacker News 科技要闻
  hackerNews:
    enabled: true
    hours: 48                 # 检索时间窗口（小时）；后劲强的热门帖子会在刊期封存前持续追踪其热度
    minPoints: 10             # 上榜最低点赞得分要求

  # Dev.to 开发者社区资讯
  devTo:
    enabled: true

  # Lobste.rs 极客资讯社区
  lobsters:
    enabled: true

  # X（Twitter）。2026年官方无免费 API：此监控列表使用官方按量计费 API 每月约需 20–30 美元
  # （可在 console.x.com 设置支出上限）；twitterapi.io / SocialData 成本更低但属于第三方非官方服务。
  # syndication 为免费实验性模式：仅对蓝标企业认证的官方机构账号实时有效。详见 docs/VERIFIED.md › v2 › X。
  # auto 模式：未配置密钥时，免费订阅仅抓取官方实验室账号（跳过个人账号如 @thsottiaux）；
  # 配置环境变量 X_BEARER_TOKEN 后，下一次运行会在 monthlyUsdCap 额度内调用官方 API 抓取完整列表。
  # 也可以直接指定模式：xapi | twitterapi_io (TWITTERAPI_IO_KEY) | socialdata | syndication
