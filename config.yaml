    enabled: false
    provider: auto
    linked: true              # 免费联动：来自 HN / 机构博文中附带链接的 X 推文无论如何都会通过免费 oEmbed 解析展示
    maxPostsPerRun: 300       # 每次运行拉取推文最大数量
    monthlyUsdCap: 20         # 每月预估美元花费软上限
    accounts:
